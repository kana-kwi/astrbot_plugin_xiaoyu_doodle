<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸小鱼的画册</title>
<style>
  :root{
    --bg:#faf8f3; --card:#fff; --ink:#2b2b2b; --sub:#8a8a8a;
    --line:#e8e3d8; --accent:#8ecae6; --accent2:#219ebc;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;
         padding:38px 34px;max-width:520px;width:100%;text-align:center}
  h1{font-size:20px;margin:0 0 8px;font-weight:600;letter-spacing:.5px}
  .sub{color:var(--sub);font-size:14px;margin:0 0 26px}
  .btn{display:inline-block;padding:13px 30px;border-radius:12px;
       background:var(--accent);color:#0b3a42;text-decoration:none;font-weight:600;font-size:15px;
       border:1px solid var(--accent2);transition:.15s;cursor:pointer}
  .btn:hover{background:var(--accent2);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line);
             font-weight:500;font-size:13px;padding:9px 18px;margin-top:10px}
  .btn.ghost:hover{background:#f4fbfe;border-color:var(--accent)}
  .ok{color:#2a9d8f;font-size:13px;height:20px;margin-top:10px}
  .link{margin-top:20px;font-size:13px;color:var(--sub);word-break:break-all}
  .link code{background:#f4f1ea;padding:4px 9px;border-radius:6px;color:var(--ink);
             font-size:13px;user-select:all}
  .tips{margin-top:26px;padding-top:18px;border-top:1px dashed var(--line);
        font-size:12.5px;color:var(--sub);text-align:left;line-height:1.9}
  .tips b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
  <div class="panel">
    <h1>鲸小鱼的画册</h1>
    <p class="sub">画册在独立端口上，点下面复制地址，开个新标签页粘进去。</p>

    <button class="btn" id="copy">复制画册地址</button>
    <div class="ok" id="msg"></div>

    <div class="link">
      地址：<code id="url">—</code>
    </div>

    <div class="tips">
      <b>要用密码</b>：插件配置里 <code>web_password</code> 那个值。<br>
      <b>给别人看</b>：把这个地址和密码发过去就行，对方不需要登 AstrBot。<br>
      <b>打不开？</b>确认 <code>web_enabled</code> 是开的，且服务器防火墙/安全组放行了 <code>8766</code>。
    </div>
  </div>

<script>
  var port = 8766;                       // 和插件配置里的 web_port 保持一致
  var url = location.protocol + '//' + location.hostname + ':' + port;
  document.getElementById('url').textContent = url;

  function ok(txt){
    var m = document.getElementById('msg');
    m.textContent = txt;
    setTimeout(function(){ m.textContent = ''; }, 2200);
  }

  document.getElementById('copy').onclick = async function(){
    try{
      await navigator.clipboard.writeText(url);
      ok('已复制，去新标签页粘贴打开');
      return;
    }catch(e){}

    // 兜底：选中地址文本再复制
    try{
      var r = document.createRange();
      r.selectNodeContents(document.getElementById('url'));
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
      document.execCommand('copy');
      ok('已复制（如果没成功，请手动选中地址复制）');
    }catch(err){
      ok('复制失败，请手动选中地址复制');
    }
  };

  document.getElementById('inside') && (document.getElementById('inside').onclick = function(){
    location.href = url;
  });
</script>
</body>
</html>
